<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15110f">
  <meta name="description" content="MarsChess — play bots from 400 to 3200 Elo or challenge real players online.">
  <title>MarsChess — Play Chess Online</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="nav" id="siteNav">
      <a class="brand" href="#home" aria-label="MarsChess home">
        <span class="brand-planet"><span>♞</span></span>
        <span class="brand-word"><b>Mars</b>Chess</span>
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="#play" data-nav="play">Play Bot</a>
        <a href="#online" data-nav="online">Play Online</a>
        <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a>
        <a href="#learn" data-nav="learn">Learn</a>
      </nav>
      <div class="nav-account" id="navAccount"></div>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="brand-planet small"><span>♞</span></span>
          <div><strong>MarsChess</strong><span>Chess for every world.</span></div>
        </div>
        <div class="footer-links">
          <a href="#play">Play Bot</a>
          <a href="#online">Play Online</a>
          <a href="#leaderboard">Leaderboard</a>
          <a href="#account">Account</a>
          <a href="#learn">How to play</a>
        </div>
        <p class="footer-note">© <span id="footerYear"></span> MarsChess. All rights reserved. Bots powered by Stockfish (GPL-3.0).</p>
      </div>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="/engine.js"></script>
  <script src="/core.js"></script>
  <script src="/board.js"></script>
  <script src="/pages.js"></script>
  <script src="/bot.js"></script>
  <script src="/online.js"></script>
  <script src="/review.js"></script>
</body>
</html>
