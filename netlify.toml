[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"
  environment = { NODE_VERSION = "22" }

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?__mc_path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
